name: Deploy production

run-name: Deploy ${{ github.sha }} to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackathon-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify, build, and package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test and build
        run: npm run verify

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Package the exact revision
        id: package
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="$RUNNER_TEMP/deploy-artifact"
          package_root="$RUNNER_TEMP/release-package"
          app_root="$package_root/app"
          static_root="$package_root/static"
          archive="$artifact_root/release.tar.gz"
          expected_assets="$artifact_root/expected-assets.txt"
          asset_checksums="$artifact_root/public-assets.sha256"
          release_paths=(
            README.md
            deploy
            docs
            index.html
            package-lock.json
            package.json
            public
            server
            src
            tsconfig.json
            vite.config.mjs
          )

          for release_path in "${release_paths[@]}"; do
            test -e "$release_path"
          done
          tracked_symlink="$(git ls-files -s -- "${release_paths[@]}" | awk '$1 == "120000" { print $4; exit }')"
          hidden_release_path="$(git ls-files -- "${release_paths[@]}" | awk -F/ '{ for (i = 1; i <= NF; i++) if ($i ~ /^\./) { print; exit } }')"
          built_symlink="$(find dist -type l -print -quit)"
          built_hardlink="$(find dist -type f -links +1 -print -quit)"
          if [[ -n "$tracked_symlink" || -n "$hidden_release_path" || -n "$built_symlink" || -n "$built_hardlink" ]]; then
            echo "Release packages must not contain hidden paths, symbolic links, or hard links." >&2
            exit 1
          fi

          install -d -m 0755 "$artifact_root" "$app_root" "$static_root"
          git archive --format=tar "$GITHUB_SHA" -- "${release_paths[@]}" | tar -xf - -C "$app_root"
          printf '%s\n' "$GITHUB_SHA" > "$app_root/RELEASE_SHA"
          cp -a dist/. "$static_root/"

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C "$package_root" \
            app static

          grep -oE '/assets/[A-Za-z0-9._-]+' dist/index.html | sort -u > "$expected_assets"
          test -s "$expected_assets"
          while IFS= read -r asset; do
            [[ "$asset" =~ ^/assets/[A-Za-z0-9._-]+$ ]]
            test -f "dist$asset"
            digest="$(sha256sum "dist$asset" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$asset" >> "$asset_checksums"
          done < "$expected_assets"

          release_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          [[ "$release_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$(tar -xOzf "$archive" app/RELEASE_SHA)" = "$GITHUB_SHA"

          echo "sha256=$release_sha256" >> "$GITHUB_OUTPUT"
          echo "Packaged commit $GITHUB_SHA ($release_sha256)"

      - name: Upload the release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy and verify production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://hackathon.shcyr.com
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PRODUCTION_ORIGIN: https://hackathon.shcyr.com

    steps:
      - name: Download the verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-artifact

      - name: Validate release identity and manifests
        shell: bash
        env:
          RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
        run: |
          set -euo pipefail

          artifact_root="$RUNNER_TEMP/deploy-artifact"
          archive="$artifact_root/release.tar.gz"
          expected_assets="$artifact_root/expected-assets.txt"
          asset_checksums="$artifact_root/public-assets.sha256"

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$archive"
          archive_size="$(stat -c '%s' "$archive")"
          [[ "$archive_size" =~ ^[0-9]+$ ]]
          (( archive_size > 0 && archive_size <= 50 * 1024 * 1024 ))
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$RELEASE_SHA256"
          test "$(tar -xOzf "$archive" app/RELEASE_SHA)" = "$GITHUB_SHA"
          test -s "$expected_assets"
          test -s "$asset_checksums"

          while IFS= read -r asset; do
            [[ "$asset" =~ ^/assets/[A-Za-z0-9._-]+$ ]]
          done < "$expected_assets"

          while read -r digest asset extra; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$asset" =~ ^/assets/[A-Za-z0-9._-]+$ ]]
            [[ -z "${extra:-}" ]]
            grep -Fxq -- "$asset" "$expected_assets"
          done < "$asset_checksums"
          test "$(wc -l < "$expected_assets" | tr -d ' ')" = \
            "$(wc -l < "$asset_checksums" | tr -d ' ')"

      - name: Upload release and invoke the fixed deploy command
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA256: ${{ needs.build.outputs.release_sha256 }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Set the DEPLOY_HOST repository variable}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER repository variable}"
          : "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY repository secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS repository secret}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          test "$DEPLOY_USER" = "hackdeploy"

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")"
          cleanup_ssh() {
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir"
          }
          trap cleanup_ssh EXIT

          ssh_key="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          chmod 0600 "$ssh_key" "$known_hosts"
          ssh-keygen -y -f "$ssh_key" >/dev/null

          remote_dir="/home/hackdeploy/incoming/$GITHUB_SHA"
          remote_partial="$remote_dir/release.tar.gz.part"
          remote_archive="$remote_dir/release.tar.gz"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_options=(
            -i "$ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o ConnectTimeout=10
          )

          ssh "${ssh_options[@]}" "$target" \
            "install -d -m 0700 -- '$remote_dir'"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/deploy-artifact/release.tar.gz" \
            "$target:$remote_partial"
          ssh "${ssh_options[@]}" "$target" \
            "mv -- '$remote_partial' '$remote_archive' && sudo -n /usr/local/sbin/deploy-hackathon-chat '$GITHUB_SHA' '$RELEASE_SHA256'"

          deployed_sha="$(ssh "${ssh_options[@]}" "$target" \
            "cat /opt/hackathon-chat/RELEASE_SHA")"
          test "$deployed_sha" = "$GITHUB_SHA"

      - name: Verify the deployed site from the public internet
        shell: bash
        run: |
          set -euo pipefail

          retry_curl=(
            --fail
            --silent
            --show-error
            --retry 12
            --retry-all-errors
            --retry-delay 5
            --connect-timeout 5
            --max-time 15
          )

          health_file="$RUNNER_TEMP/production-health.json"
          curl "${retry_curl[@]}" --proto '=https' --tlsv1.2 \
            "$PRODUCTION_ORIGIN/api/health" -o "$health_file"
          jq -e \
            '.status == "ok" and .service == "liangpei-hackathon-api"' \
            "$health_file" >/dev/null

          public_index="$RUNNER_TEMP/production-index.html"
          expected_assets="$RUNNER_TEMP/deploy-artifact/expected-assets.txt"
          asset_checksums="$RUNNER_TEMP/deploy-artifact/public-assets.sha256"
          deployed_index_matches=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 5 --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_ORIGIN/?release=$GITHUB_SHA" -o "$public_index"; then
              deployed_index_matches=true
              while IFS= read -r asset; do
                if ! grep -Fq -- "$asset" "$public_index"; then
                  deployed_index_matches=false
                  break
                fi
              done < "$expected_assets"
              if [[ "$deployed_index_matches" == true ]]; then
                break
              fi
            fi
            sleep 5
          done
          [[ "$deployed_index_matches" == true ]]

          while read -r expected_digest asset extra; do
            [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$asset" =~ ^/assets/[A-Za-z0-9._-]+$ ]]
            [[ -z "${extra:-}" ]]
            downloaded_asset="$RUNNER_TEMP/$(basename "$asset")"
            curl "${retry_curl[@]}" --proto '=https' --tlsv1.2 \
              "$PRODUCTION_ORIGIN$asset" -o "$downloaded_asset"
            test "$(sha256sum "$downloaded_asset" | cut -d ' ' -f 1)" = "$expected_digest"
          done < "$asset_checksums"

          curl "${retry_curl[@]}" --proto '=https' --tlsv1.2 \
            "$PRODUCTION_ORIGIN/carnival?release=$GITHUB_SHA" -o /dev/null

          redirect_target="$(curl --fail --silent --show-error --proto '=http' \
            --connect-timeout 5 --max-time 15 \
            -o /dev/null -w '%{redirect_url}' \
            "http://hackathon.shcyr.com/")"
          test "$redirect_target" = "$PRODUCTION_ORIGIN/"

          echo "Deployment $GITHUB_SHA is healthy and serving the expected build."
